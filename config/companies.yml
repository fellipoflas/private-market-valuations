# The companies we track.
#
# Each entry drives the GDELT/RSS search queries, so the aliases and exclude_terms
# matter a lot. We learned this the hard way: a bare "Anduril" search returned
# stories about Tolkien's sword and unrelated defense contractors.
#
# Fields:
#   id            - stable snake_case key. This is the natural key in the database.
#                   Never change it once data exists, or you orphan rows.
#   display_name  - what shows up in the dashboard
#   sector        - COARSE bucket, ~8 values. Kept low-cardinality on purpose:
#                   a grouping attribute with 26 values makes charts useless
#                   because almost every group has one member.
#   subsector     - the detailed label. Fine for tooltips, bad for grouping.
#   hq_country    - ISO-ish country name
#   aliases       - extra spellings to OR into the search query
#   exclude_terms - if these appear, it's probably a false positive
#   fp_risk       - low/medium/high. How likely a name collision is. High-risk names
#                   need tighter queries and get flagged on the data-quality page.
#   status        - private (default) | public | acquired
#                   Companies that IPO'd or got bought stay in the file because
#                   their historical private rounds are still real data, and
#                   "graduated" companies are interesting in their own right.
#                   The dashboard filters to status=private by default.
#   status_note   - what happened, and when
#   status_source_url - where that claim was verified. Same provenance rule as
#                   every funding figure: if you can't link it, don't assert it.
#
# Re-check status before each seed refresh. Of the original 37 names, 5 had
# already left the private universe by Sept 2026 (1 IPO, 4 acquisitions). That
# churn rate is itself a finding worth putting on the dashboard.

companies:
  # ---------- AI / foundation models ----------
  - id: openai
    display_name: OpenAI
    sector: AI & ML
    subsector: AI Foundation Models
    hq_country: United States
    aliases: ["Open AI"]
    exclude_terms: []
    fp_risk: low

  - id: anthropic
    display_name: Anthropic
    sector: AI & ML
    subsector: AI Foundation Models
    hq_country: United States
    aliases: []
    exclude_terms: []
    fp_risk: low

  - id: xai
    display_name: xAI
    sector: AI & ML
    subsector: AI Foundation Models
    hq_country: United States
    aliases: ["xAI Corp", "Elon Musk xAI"]
    # "XAI" also means "explainable AI" in academic writing - big false positive source.
    # "Grok" is their model, not the company, but coverage overlaps heavily.
    exclude_terms: ["explainable AI", "explainable artificial intelligence"]
    fp_risk: high
    status: acquired
    status_note: "Acquired by SpaceX Feb 2026 valuing xAI at ~$250B"
    status_source_url: "https://techcrunch.com/2026/02/02/elon-musk-spacex-acquires-xai-data-centers-space-merger/"

  - id: mistral_ai
