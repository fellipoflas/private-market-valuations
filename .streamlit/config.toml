# Theme is pinned rather than following the viewer's OS setting, because the
# chart palette was validated for contrast against this specific surface colour.
# Letting it flip to dark would invalidate that.
[theme]
base = "light"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"
font = "sans serif"

[server]
headless = true
